todos:
  - id: foundation
    content: Establish the static Vite/Tailwind project, safe browser-local model, authentication helpers, and release configuration.
    scope: L
    files:
      - .gitignore
      - README.md
      - vercel.json
      - frontend/package.json
      - frontend/index.html
      - frontend/vite.config.js
      - frontend/tailwind.config.js
      - frontend/postcss.config.js
      - frontend/src/index.css
      - frontend/src/utils/storage.js
      - frontend/src/utils/auth.js
      - frontend/src/components/Avatar.jsx
      - frontend/src/utils/storage.test.js
      - frontend/src/utils/auth.test.js
      - frontend/e2e/foundation.spec.js
    acceptance:
      - localStorage helpers use the required keys and return safe empty values for corrupt reads
      - admin/admin authenticates before stored users and cannot be treated as a deletable stored account
      - Vite, Tailwind, JavaScript/JSX, and the Vercel-only rewrite contract build successfully
    verify: cd frontend && node node_modules/vitest/vitest.mjs run src/utils/storage.test.js src/utils/auth.test.js
    status: pending
  - id: onboarding
    content: Implement public discovery, login, self-registration, and role-aware session redirects.
    scope: L
    files:
      - frontend/src/components/PublicNavbar.jsx
      - frontend/src/components/Footer.jsx
      - frontend/src/pages/LandingPage.jsx
      - frontend/src/pages/LoginPage.jsx
      - frontend/src/pages/RegisterPage.jsx
      - frontend/src/App.jsx
      - frontend/src/pages/LandingPage.test.jsx
      - frontend/src/pages/AuthPages.test.jsx
      - frontend/e2e/onboarding.spec.js
    acceptance:
      - guests see required landing CTAs, feature copy, and a safe latest-post empty state
      - valid registration persists a unique user session and routes to blogs while invalid fields show inline errors
      - admin login routes to admin and invalid credentials show the exact required inline error
    verify: cd frontend && node node_modules/vitest/vitest.mjs run src/pages/LandingPage.test.jsx src/pages/AuthPages.test.jsx
    status: pending
  - id: blogs
    content: Implement protected reading, author-owned post creation/editing/deletion, and responsive navigation.
    scope: L
    files:
      - frontend/src/components/ProtectedRoute.jsx
      - frontend/src/components/Navbar.jsx
      - frontend/src/components/BlogCard.jsx
      - frontend/src/pages/Home.jsx
      - frontend/src/pages/ReadBlog.jsx
      - frontend/src/pages/WriteBlog.jsx
      - frontend/src/components/BlogCard.test.jsx
      - frontend/src/pages/WriteBlog.test.jsx
      - frontend/e2e/blogs.spec.js
    acceptance:
      - guests are redirected from protected blog routes and users cannot edit or delete another author post
      - authenticated users create UUID/timestamped posts and can read, update, and delete their own posts
      - missing posts render Post not found and cards display required excerpt, date, author, and authorized edit control
    verify: cd frontend && node node_modules/vitest/vitest.mjs run src/components/BlogCard.test.jsx src/pages/WriteBlog.test.jsx
    status: pending
  - id: admin-dashboard
    content: Implement the administrator dashboard with metrics, quick actions, and privileged recent-post controls.
    scope: S
    files:
      - frontend/src/components/StatCard.jsx
      - frontend/src/pages/AdminDashboard.jsx
      - frontend/src/pages/AdminDashboard.test.jsx
      - frontend/e2e/admin-dashboard.spec.js
    acceptance:
      - administrator dashboard renders four required statistics and five most recent posts
      - non-administrator navigation is redirected to blogs by the existing protected route
      - administrator controls may edit or delete every displayed post
    verify: cd frontend && node node_modules/vitest/vitest.mjs run src/pages/AdminDashboard.test.jsx
    status: pending
  - id: user-management
    content: Implement administrator local account creation, responsive presentation, and deletion protections.
    scope: S
    files:
      - frontend/src/components/UserRow.jsx
      - frontend/src/pages/UserManagement.jsx
      - frontend/src/pages/UserManagement.test.jsx
      - frontend/e2e/users.spec.js
    acceptance:
      - administrator can create a role-assigned unique local account with a UUID and timestamp
      - default admin deletion remains disabled and current account self-deletion is prevented
      - user list renders role avatar/badge and responsive account details
    verify: cd frontend && node node_modules/vitest/vitest.mjs run src/pages/UserManagement.test.jsx
    status: pending
